# regex_patterns.yaml
# Configuratiebestand met regex patronen voor cardiovasculaire risicofactoren

# Algemene afkapwaarden voor risicofactoren
THRESHOLDS:
  # BMI thresholds
  bmi_overweight: 25.0
  bmi_obesity: 30.0
  
  # Blood pressure thresholds (mmHg)
  bp_systolic: 140
  bp_diastolic: 90
  
  # Cholesterol thresholds (mmol/L)
  cholesterol_total: 5.0
  cholesterol_ldl: 3.0
  
  # Glucose/diabetes thresholds
  glucose: 7.0    # Fasting glucose (mmol/L)
  hba1c: 6.5      # HbA1c percentage
  
  # Alcohol consumption thresholds
  alcohol_day: 3   # Units per day
  alcohol_week: 14 # Units per week

# Algemene negatie termen (worden in meerdere extractiefuncties gebruikt)
NEGATION_PATTERNS:
  - "\\bniet\\b"
  - "\\bgeen\\b"
  - "\\bnooit\\b"
  - "\\bontken"
  - "\\bontkent\\b"
  - "\\bafwez\\w+\\b"
  - "\\bnormaal\\b"
  - "\\bnormale\\b"
  - "\\bnegatief\\b"

# Algemene exclusie termen voor medicatiegebruik
MEDICATION_EXCLUSION_PATTERNS:
  - "gestopt"
  - "allergie"
  - "bijwerking"
  - "intolerant"
  - "verdraagt niet"
  - "niet verdragen"
  - "afbouw"
  - "overwegen"
  - "advies om te starten"
  - "zou kunnen starten"
  - "weigert"
  - "geweigerd"

# Roken
