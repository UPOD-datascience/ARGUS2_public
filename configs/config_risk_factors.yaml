    - "fitness"

# Alcoholgebruik
ALCOHOL_USE_PATTERNS:
  risky_alcohol:
    - "alcoholmisbruik"
    - "alcoholabuse"
    - "alcoholproblem\\w+"
    - "alcoholisme"
    - "alcoholver(?:slaving|slaafde)"
    - "overmatig\\s+alcohol(?:gebruik|intake)"
    - "teveel\\s+alcohol"
    - "alcohol\\s+overcons(?:umptie|umerend)"
    - "alcohola(?:buse|fhankelijk|fhankelijkheid)"
    - "(?:chronisch|zwaar|veel)\\s+alc(?:ohol|ohol\\s+gebruik|\\s+gebruik)"
    - "(?:riskant|problematisch)\\s+alc(?:ohol|ohol\\s+gebruik|\\s+gebruik)"
    - "alc(?:ohol|ohol\\s+gebruik|\\s+gebruik)\\s+(?:probleem|problemen)"
    - "alc(?:ohol|ohol\\s+gebruik|\\s+gebruik)\\s*:\\s*(?:overmatig|teveel|veel|probleem|problemen)"
  alcohol_quantity:
  # Pattern 1: Number + unit + beverage + time (e.g., "6 glazen wijn per dag")
  - "(\\d+)\\s*(?:eenhe(?:id|den)|glazen|consumpties)\\s*(?:alcohol|wijn|bier)\\s*(?:per\\s*dag|p\\.?\\s*d\\.?|daags|dags)"
  # Pattern 2: Number + unit + time (e.g., "4 glazen per dag") 
  - "(\\d+)\\s*(?:eenhe(?:id|den)|glazen|consumpties)\\s*(?:per\\s*dag|p\\.?\\s*d\\.?|daags|dags)"
  # Pattern 3: Number + unit + beverage + per week
  - "(\\d+)\\s*(?:eenhe(?:id|den)|glazen|consumpties)\\s*(?:alcohol|wijn|bier)\\s*(?:per\\s*week|p\\.?\\s*w\\.?|wekelijks)"
  # Pattern 4: Number + unit + per week
  - "(\\d+)\\s*(?:eenhe(?:id|den)|glazen|consumpties)\\s*(?:per\\s*week|p\\.?\\s*w\\.?|wekelijks)"
  non_risky_alcohol:
    - "geen\\s+alcohol(?:gebruik|inname)"
    - "drinkt\\s+niet"
    - "gebruikt\\s+geen\\s+alcohol"
    - "alcohol\\s*:\\s*(?:nee|geen|gestopt|niet|nooit|zelden)"
    - "(?:matig|beperkt|sociaal|incidenteel|occasioneel)\\s+alcohol(?:gebruik|inname)"
    - "(?:matig|beperkt|sociaal|incidenteel|occasioneel)\\s+alc\\w*\\s+gebruik"
    - "alcohol\\s*:\\s*(?:matig|beperkt|sociaal|incidenteel|occasioneel)"
  alcohol_terms:
    - "alcohol"
    - "drank"
    - "drinkgedrag"
    - "etoh"
    - "wijn"
    - "bier"
    - "sterke\\s+drank"

