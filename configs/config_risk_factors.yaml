    - "rookt\\s*:\\s*nee"
    - "rookt\\s*:\\s*niet"
    - "rookt\\s*:\\s*nooit"
    - "nicotine\\s*:\\s*nee"
    - "niet\\s+rok"
    - "nooit\\s+gerok"
    - "geen\\s+rok"
    - "gestopt\\s+met\\s+rok"
  clear_smoker:
    - "roken\\s*:\\s*ja"
    - "roken\\s*:\\s*(\\d+)"
    - "rookt\\s*:\\s*ja"
    - "rookt\\s*(\\d+)"
    - "sigaretten\\s*per\\s*dag\\s*:\\s*(\\d+)"
    - "pakjes\\s*per\\s*dag\\s*:\\s*(\\d+)"
  smoking_terms:
