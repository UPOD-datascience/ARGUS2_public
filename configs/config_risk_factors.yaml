    - "onvoldoende\\s+beweg\\w+"
    - "geen\\s+lichaamsbeweging"
    - "geen\\s+sport"
    - "niet\\s+(?:actief|sportief)"
    - "nauwelijks\\s+beweg\\w+"
  activity:
    - "(?:veel|voldoende|regelmatig|dagelijks)\\s+beweg\\w+"
    - "actieve\\s+levensstijl"
    - "fysiek\\s+actief"
    - "lichamelijk\\s+actief"
    - "sport\\s+(?:regelmatig|wekelijks|dagelijks)"
    - "beweegt\\s+(?:regelmatig|voldoende|veel)"
    - "(?:doet|beoefent)\\s+aan\\s+sport"
    - "sportief"
    - "goede\\s+conditie"
    - "traint\\s+(?:regelmatig|wekelijks|dagelijks)"
    - "wandelt\\s+(?:regelmatig|dagelijks)"
    - "fiets\\w+\\s+(?:regelmatig|dagelijks|naar\\s+(?:werk|het\\s+werk))"
  activity_terms:
    - "beweg\\w+"
    - "lichamelijk"
    - "fysiek"
    - "sport\\w*"
    - "activ\\w+"
    - "conditie"
