    - "cardiale\\s+familieanamnese\\s*:\\s*positief"
    - "cardiovasculaire\\s+belasting\\s+in\\s+(?:de\\s+)?familie"
    - "hart(?:problemen|ziekten|aandoeningen)\\s+in\\s+de\\s+familie"
    - "plotse\\s+hartdood\\s+in\\s+de\\s+familie"
    - "vader/moeder\\s+(?:overleden\\s+aan|gehad)\\s+(?:hartinfarct|beroerte|cva|hartfalen)"
    - "(?:vader|moeder|broer|zus|opa|oma|ouders?)\\s+(?:overleden|gestorven|bezweken|omgekomen)\\s+(?:aan|door|vanwege|tengevolge\\s+van|als\\s+gevolg\\s+van)\\s+(?:hart\\w*|myocard\\w*|beroerte|CVA|infarct)(?:\\s+op\\s+\\d+-?jarige\\s+leeftijd)?"
    - "(?:vader|moeder|broer|zus|opa|oma)\\s+(?:overleden|gestorven)\\s+(?:aan|door|vanwege)\\s+(?:hart\\w*|beroerte|CVA)"
  negative_family_cvd:
