    - "wel"
    - "dagelijks"
    - "per dag"
    - "pakje"
    - "pakjes"
    - "sinds"
    - "jaar"
    - "pack"
    - "shag"
    - "pijp"

# Hypertensie
HYPERTENSION_PATTERNS:
  hypertension:
    - "hypertensie\\b"
    - "hoge\\s+bloeddruk"
    - "verhoogde\\s+bloeddruk"
    - "tensie\\s*verhoogd"
    - "bloeddruk\\s*verhoogd"
    - "bloeddruk\\s*te\\s*hoog"
    - "hypertensief"
    - "hypertens\\w+"  # Vangt hypertensieve, hypertensie, etc.
    - "RR\\s*[><≥≤:=\\s]*\\s*(?:1[4-9]\\d|[2-9]\\d{2})[\\/\\s]"  # RR > 140/...
    - "bloeddruk\\s*[><≥≤:=\\s]*\\s*(?:1[4-9]\\d|[2-9]\\d{2})[\\/\\s]"  # bloeddruk > 140/...
    - "systolisch\\s*[><≥≤:=\\s]*\\s*(?:1[4-9]\\d|[2-9]\\d{2})"  # systolisch > 140
    - "diastolisch\\s*[><≥≤:=\\s]*\\s*(?:[9][0-9]|1\\d{2})"  # diastolisch > 90
  hypertension_meds:
    - "ace.?remmer"
    - "ace.?inhibitor"
    - "enalapril"
    - "lisinopril"
    - "perindopril"
    - "ramipril"
    - "captopril"
    - "fosinopril"
    - "quinapril"
    - "cilazapril"
    - "trandolapril"
    - "spirapril"
    - "sartan"
    - "valsartan"
    - "losartan"
    - "candesartan"
    - "irbesartan"
    - "telmisartan"
    - "olmesartan"
    - "eprosartan"
    - "azilsartan"
    - "diureticum"
    - "diuretisch"
    - "diuretica"
    - "hydrochloorthiazide"
    - "hctz"
    - "chloortalidon"
    - "indapamide"
    - "bumetanide"
    - "furosemide"
    - "lasix"
    - "spironolacton"
    - "eplerenon"
    - "beta.?blokker"
    - "bètablokker"
    - "betablocker"
    - "metoprolol"
    - "atenolol"
    - "bisoprolol"
    - "carvedilol"
    - "nebivolol"
    - "propranolol"
    - "labetalol"
    - "sotalol"
    - "calciumantagonist"
    - "calcium.?blokker"
    - "amlodipine"
    - "nifedipine"
    - "felodipine"
    - "lercanidipine"
    - "barnidipine"
    - "verapamil"
    - "diltiazem"
    - "doxazosine"
    - "moxonidine"
    - "clonidine"
    - "hydralazine"
    - "minoxidil"
  bp_patterns:
    # Formaat "120/80"
    - "(?:RR|BD|bloeddruk|tensie)\\s*:?\\s*(\\d{2,3})\\s*[\\/]\\s*(\\d{2,3})"
    # Formaat "systolisch 120, diastolisch 80"
    - "systolisch\\s*:?\\s*(\\d{2,3})[\\s,]+diastolisch\\s*:?\\s*(\\d{2,3})"
  other_indications:
    - "hartfalen"
    - "aritmie"
    - "oedeem"
    - "angina"
    - "coronair"
    - "infarct"
    - "cvd"
    - "beroerte"
    - "hartritmestoornis"
    - "nierfalen"
    - "gestopt"
  non_hypertension:
    - "geen\\s+hypertensie"
    - "geen\\s+hoge\\s+bloeddruk"
    - "normale\\s+bloeddruk"
    - "normotensief"
    - "bloeddruk\\s+normaal"
    - "tensie\\s+normaal"
  hypertension_terms:
    - "bloeddruk"
    - "tensie"
    - "RR"
    - "hypertens"

# Hypercholesterolemie
HYPERCHOLESTEROLEMIA_PATTERNS:
  hypercholesterolemia:
    - "hypercholesterolemie\\b"
    - "hypercholesterol\\w+"
    - "hyperlipidemie\\b"
    - "hyperlipidem\\w+"
    - "verhoogd\\w*\\s+cholesterol"
    - "verhoogd\\w*\\s+lipiden"
    - "hoog\\s+cholesterol"
    - "cholesterol\\s*verhoogd"
    - "cholesterol\\s*te\\s*hoog"
    - "dyslipidemie\\b"
    - "dyslipidem\\w+"
    - "cholesterol\\s*[><≥≤:=\\s]*\\s*(?:[5-9][.,]\\d|\\d{2,}[.,]\\d|\\d{2,})\\s*mmol"  # cholesterol > 5,0 mmol/L
    - "ldl\\s*[><≥≤:=\\s]*\\s*(?:[3-9][.,]\\d|\\d{2,}[.,]\\d|\\d{2,})\\s*mmol"  # LDL > 3,0 mmol/L
    - "totaal\\s*cholesterol\\s*[><≥≤:=\\s]*\\s*(?:[5-9][.,]\\d|\\d{2,}[.,]\\d|\\d{2,})"  # totaal cholesterol > 5,0
  mild_statins:
    - "simvastatine"
    - "zocor"
  potent_statins:
    - "atorvastatine"
    - "lipitor"
    - "rosuvastatine"
    - "crestor"
  additional_meds:
    - "ezetimibe"
    - "ezetrol"
    - "inegy"
  other_cholesterol_meds:
    - "statine"
    - "pravastatine"
    - "fluvastatine"
    - "lovastatine"
    - "PCSK9.?remm\\w*"
    - "evolocumab"
    - "alirocumab"
    - "repatha"
    - "praluent"
    - "cholesterolverlagers"
    - "cholesterolsyntheseremm\\w*"
    - "fibraten"
    - "gemfibrozil"
    - "fenofibraat"
    - "nicotinezuur"
    - "galzuurbinders"
    - "colestyramine"
    - "colesevelam"
    - "questran"
    - "cholestagel"
    - "icosapent"
  cholesterol_patterns:
    # Formaat "cholesterol: 6,2 mmol/l"
    - "(?:totaal\\s*)?cholesterol\\s*:?\\s*(\\d+[.,]\\d+)\\s*(?:mmol|mg)"
    # Formaat "LDL: 4,1 mmol/l"
    - "ldl(?:\\s*-?cholesterol)?\\s*:?\\s*(\\d+[.,]\\d+)\\s*(?:mmol|mg)"
    # Formaat "cholesterolgehalte: 7,3"
    - "cholesterolgehalte\\s*:?\\s*(\\d+[.,]\\d+)"
  non_hypercholesterolemia:
    - "geen\\s+hypercholesterolemie"
    - "geen\\s+verhoogd\\s+cholesterol"
    - "normaal\\s+cholesterol"
    - "cholesterol\\s+normaal"
    - "normale\\s+cholesterolwaarden"
    - "lipidenprofiel\\s+normaal"
  cholesterol_terms:
    - "cholesterol"
    - "lipiden"
    - "dyslipidemie"
    - "ldl"
    - "hdl"
    - "triglycerid"

# Diabetes
DIABETES_PATTERNS:
  diabetes:
    - "diabet\\w+"  # diabetes, diabetisch, etc.
    - "dm\\s*(?:type)?\\s*[12]"  # DM type 1, DM type 2, DM1, DM2
    - "dm\\s*[12]"  # DM1, DM2
    - "diabetes\\s*mellitus"
    - "diabetes\\s*type\\s*[12]"
    - "t[12]dm"  # T1DM, T2DM
    - "suikerziekte"
    - "glucose\\s*intolerantie"
    - "hyperglycemi\\w+"
    - "hba1c\\s*[><≥≤:=\\s]*\\s*(?:[6-9][.,]\\d|\\d{2,}[.,]\\d|\\d{2,})"  # HbA1c > 6,0%
    - "nuchtere\\s*glucose\\s*[><≥≤:=\\s]*\\s*(?:[7-9][.,]\\d|\\d{2,}[.,]\\d|\\d{2,})"  # nuchter glucose > 7,0 mmol/L
    - "iddm"  # Insulin-dependent diabetes mellitus
    - "niddm"  # Non-insulin-dependent diabetes mellitus
    - "mody"  # Maturity onset diabetes of the young
    - "lada"  # Latent autoimmune diabetes in adults
  diabetes_meds:
    # Insulines
    - "insuline"
    - "novorapid"
    - "humalog"
    - "novomix"
    - "lantus"
    - "levemir"
    - "tresiba"
    - "toujeo"
    - "fiasp"
    - "apidra"
    - "actrapid"
    - "insulatard"
    - "mixtard"
    - "protaphane"
    - "humuline"
    - "abasaglar"
    - "semglee"
    # Orale antidiabetica
    - "metformine"
    - "glibenclamide"
    - "gliclazide"
    - "glimepiride"
    - "tolbutamide"
    - "acarbose"
    - "pioglitazon"
    - "dapagliflozine"
    - "empagliflozine"
    - "canagliflozine"
    - "linagliptine"
    - "saxagliptine"
    - "sitagliptine"
    - "vildagliptine"
    - "semaglutide"
    - "liraglutide"
    - "dulaglutide"
    - "exenatide"
    - "lixisenatide"
    - "repaglinide"
    - "nateglinide"
    # Medicatiegroepen
    - "sglt-?2\\s*remm\\w*"
    - "dpp-?4\\s*remm\\w*"
    - "glp-?1\\s*agon\\w*"
    - "sulfonylureum"
    - "biguanide"
    - "glitazon"
    - "glinide"
  glucose_patterns:
    # Formaat "glucose: 8,2 mmol/l"
    - "(?:nuchtere\\s*)?glucose\\s*:?\\s*(\\d+[.,]\\d+)\\s*(?:mmol|mg)"
    # Formaat "HbA1c: 7,1%"
    - "hba1c\\s*:?\\s*(\\d+[.,]\\d+)\\s*(?:%|mmol)"
  non_diabetes:
    - "geen\\s+diabetes"
    - "geen\\s+dm"
    - "normale\\s+glucose"
    - "glucose\\s+normaal"
    - "normale\\s+bloedsuiker"
    - "bloedsuiker\\s+normaal"
    # diabetes indicatie maar behorend tot een ander persoon
    - "(?:vader|moeder|broer|zus|opa|oma|familie|partner|ouders?)\\s+(?:heeft|hebben|had)\\s+(?:diabet\\w*|dm\\s*(?:type)?\\s*[12])"
    - "(?:diabet\\w*|dm\\s*(?:type)?\\s*[12])\\s+(?:in\\s+de\\s+)?familie"
    - "familieanamnese.*(?:diabet\\w*|dm)"
    - "(?:vader|moeder|broer|zus|opa|oma).*(?:diabet\\w*|dm).*patiënt.*(?:zelf\\s+)?(?:nog\\s+)?gezond"
  diabetes_terms:
    - "glucose"
    - "bloedsuiker"
    - "suiker"
    - "hba1c"
    - "dm"
    - "diabetes"

# Obesitas/overgewicht
OBESITY_PATTERNS:
  obesity:
    - "obesitas"
    - "obees"
    - "morbide\\s+obees"
    - "morbide\\s+obesitas"
    - "overgewicht"
