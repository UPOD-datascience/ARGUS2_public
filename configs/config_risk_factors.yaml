    - "zwaarlijvig"
    - "te\\s+zwaar"
    - "verhoogd\\s+gewicht"
    - "verhoogde\\s+bmi"
    - "bmi\\s*[><≥≤:=\\s]*\\s*(?:25|[3-9][0-9])"  # BMI >= 25
  bmi_pattern: "bmi\\s*:?\\s*(\\d+[.,]?\\d*)"
  length_pattern: "lengte\\s*:?\\s*(\\d+[.,]?\\d*)\\s*(?:cm|m)"
  weight_pattern: "gewicht\\s*:?\\s*(\\d+[.,]?\\d*)\\s*(?:kg)"
  non_obesity:
    - "geen\\s+obesitas"
    - "geen\\s+overgewicht"
    - "normaal\\s+gewicht"
    - "gezond\\s+gewicht"
  weight_terms:
    - "gewicht"
    - "bmi"
    - "lichaamsgewicht"
    - "lichaams\\s*massa"

